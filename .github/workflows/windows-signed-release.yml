name: Windows signed release candidate

on:
  workflow_dispatch:
    inputs:
      confirm_signing_candidate:
        description: Build a protected signed Windows candidate without publishing it
        required: true
        type: boolean
        default: false
      candidate_commit:
        description: Full 40-character commit SHA to freeze for this candidate
        required: true
        type: string
      candidate_version:
        description: Exact package.json version to sign (e.g. 0.1.1-beta.6 or 1.0.0)
        required: true
        type: string
        default: 1.0.0

permissions:
  contents: read

jobs:
  signed-candidate:
    if: inputs.confirm_signing_candidate == true
    runs-on: windows-latest
    environment: windows-production-signing
    timeout-minutes: 45
    env:
      # Azure Trusted Signing — Microsoft Entra ID EnvironmentCredential reads these three secrets.
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      # Non-secret Trusted Signing identifiers (from your Azure Trusted Signing account/profile).
      WINDOWS_PUBLISHER_SUBJECT: ${{ vars.WINDOWS_PUBLISHER_SUBJECT }}
      AZURE_CODE_SIGNING_ENDPOINT: ${{ vars.AZURE_CODE_SIGNING_ENDPOINT }}
      AZURE_CODE_SIGNING_ACCOUNT: ${{ vars.AZURE_CODE_SIGNING_ACCOUNT }}
      AZURE_CODE_SIGNING_PROFILE: ${{ vars.AZURE_CODE_SIGNING_PROFILE }}
      EXPECTED_WINDOWS_PUBLISHER: ${{ vars.WINDOWS_PUBLISHER_SUBJECT }}
      EXPECTED_CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
      EXPECTED_CANDIDATE_VERSION: ${{ inputs.candidate_version }}
      VITE_RELEASE_CHANNEL: stable
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_commit }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Fail closed when protected Trusted Signing configuration is absent
        shell: pwsh
        run: |
          foreach ($name in 'AZURE_TENANT_ID','AZURE_CLIENT_ID','AZURE_CLIENT_SECRET') {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) { throw "$name secret is not configured in the protected environment." }
          }
          foreach ($name in 'WINDOWS_PUBLISHER_SUBJECT','AZURE_CODE_SIGNING_ENDPOINT','AZURE_CODE_SIGNING_ACCOUNT','AZURE_CODE_SIGNING_PROFILE') {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) { throw "$name variable is not configured in the protected environment." }
          }
      - name: Confirm .NET is available for the Trusted Signing tooling
        shell: pwsh
        run: dotnet --version
      - name: Freeze exact source and version
        shell: pwsh
        run: |
          if ($env:EXPECTED_CANDIDATE_COMMIT -notmatch '^[0-9a-fA-F]{40}$') { throw 'candidate_commit must be a full 40-character SHA.' }
          $actualCommit = (git rev-parse HEAD).Trim()
          if ($actualCommit -ne $env:EXPECTED_CANDIDATE_COMMIT.ToLowerInvariant()) { throw 'Checked-out source does not match candidate_commit.' }
          $actualVersion = (node -p "require('./package.json').version").Trim()
          # Integrity gate: the declared candidate_version must match package.json exactly. (Any
          # version is signable — beta or stable — so the current distributed build can be signed.)
          if ($env:EXPECTED_CANDIDATE_VERSION -ne $actualVersion) { throw "package.json version ($actualVersion) does not match candidate_version ($env:EXPECTED_CANDIDATE_VERSION)." }
          "PICOM_CANDIDATE_COMMIT=$actualCommit" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PICOM_CANDIDATE_VERSION=$actualVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: npm ci
      - run: npm run quality:gate
      - name: Package signed Windows installer (Azure Trusted Signing)
        run: npm run package:win -- --config electron-builder.windows-release.yml
      - name: Verify installer signature, publisher and timestamp
        shell: pwsh
        run: ./scripts/verify-windows-signature.ps1 -Path 'release/Picom-*-Windows-x64.exe' -ExpectedPublisher $env:EXPECTED_WINDOWS_PUBLISHER
      - name: Generate post-signing checksum and provenance
        shell: pwsh
        run: |
          npm run generate-checksums
          npm run verify-checksums
          npm run generate-provenance
      - name: Upload immutable candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: picom-windows-signed-candidate
          path: |
            release/Picom-*-Windows-x64.exe
            release/SHA256SUMS.txt
            release/provenance.json
          if-no-files-found: error
          retention-days: 14
