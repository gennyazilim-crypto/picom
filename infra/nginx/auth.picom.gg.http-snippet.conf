# Include from http {} (Ubuntu: /etc/nginx/conf.d/).
# Access logs must not record query strings (codes, state, exchange tokens).

log_format picom_auth_redacted '$remote_addr - $host [$time_local] "$request_method $uri" $status $body_bytes_sent';
limit_req_zone $binary_remote_addr zone=picom_auth:10m rate=10r/s;
