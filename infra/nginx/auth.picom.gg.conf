# auth.picom.gg — TLS terminator for the local auth-gateway (127.0.0.1:4180).
# Do not proxy_pass to supabase.co. Query strings must not appear in access logs.

server {
  listen 80;
  listen [::]:80;
  server_name auth.picom.gg;
  return 301 https://auth.picom.gg$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name auth.picom.gg;

  ssl_certificate /etc/letsencrypt/live/auth.picom.gg/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/auth.picom.gg/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  access_log /var/log/nginx/auth.picom.gg.access.log picom_auth_redacted;
  error_log /var/log/nginx/auth.picom.gg.error.log warn;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;
  server_tokens off;

  client_max_body_size 16k;

  location = /health {
    limit_req zone=picom_auth burst=20 nodelay;
    proxy_pass http://127.0.0.1:4180;
    proxy_http_version 1.1;
    proxy_set_header Host auth.picom.gg;
    proxy_set_header X-Forwarded-Host auth.picom.gg;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_hide_header X-Powered-By;
    proxy_connect_timeout 3s;
    proxy_read_timeout 8s;
  }

  location = /google/start {
    limit_req zone=picom_auth burst=10 nodelay;
    proxy_pass http://127.0.0.1:4180;
    proxy_http_version 1.1;
    proxy_set_header Host auth.picom.gg;
    proxy_set_header X-Forwarded-Host auth.picom.gg;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
  }

  location = /google/callback {
    limit_req zone=picom_auth burst=10 nodelay;
    proxy_pass http://127.0.0.1:4180;
    proxy_http_version 1.1;
    proxy_set_header Host auth.picom.gg;
    proxy_set_header X-Forwarded-Host auth.picom.gg;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_connect_timeout 3s;
    proxy_read_timeout 20s;
  }

  location = /steam/start {
    limit_req zone=picom_auth burst=10 nodelay;
    proxy_pass http://127.0.0.1:4180;
    proxy_http_version 1.1;
    proxy_set_header Host auth.picom.gg;
    proxy_set_header X-Forwarded-Host auth.picom.gg;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
  }

  location = /steam/callback {
    limit_req zone=picom_auth burst=10 nodelay;
    proxy_pass http://127.0.0.1:4180;
    proxy_http_version 1.1;
    proxy_set_header Host auth.picom.gg;
    proxy_set_header X-Forwarded-Host auth.picom.gg;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_connect_timeout 3s;
    proxy_read_timeout 20s;
  }

  location = /epic/start {
    limit_req zone=picom_auth burst=10 nodelay;
    proxy_pass http://127.0.0.1:4180;
    proxy_http_version 1.1;
    proxy_set_header Host auth.picom.gg;
    proxy_set_header X-Forwarded-Host auth.picom.gg;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
  }

  location = /epic/callback {
    limit_req zone=picom_auth burst=10 nodelay;
    proxy_pass http://127.0.0.1:4180;
    proxy_http_version 1.1;
    proxy_set_header Host auth.picom.gg;
    proxy_set_header X-Forwarded-Host auth.picom.gg;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_connect_timeout 3s;
    proxy_read_timeout 20s;
  }

  location / {
    return 404;
  }
}
